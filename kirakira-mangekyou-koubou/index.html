<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#2a1a3e">
<title>きらきら まんげきょう こうぼう</title>
<link rel="stylesheet" href="css/style.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='46' fill='%232a1a3e'/%3E%3Ccircle cx='50' cy='50' r='30' fill='none' stroke='%23ffd166' stroke-width='4'/%3E%3Ccircle cx='42' cy='44' r='8' fill='%23ff8fb3'/%3E%3Ccircle cx='60' cy='52' r='6' fill='%237cc8ff'/%3E%3Ccircle cx='50' cy='62' r='5' fill='%23ffd166'/%3E%3C/svg%3E">
</head>
<body>
<div id="app">

  <!-- ══════════════ タイトル ══════════════ -->
  <section id="screen-title" class="screen visible">
    <canvas id="title-canvas"></canvas>
    <div class="title-overlay">
      <div class="title-logo">
        <span class="logo-line1">✦ きらきら ✦</span>
        <span class="logo-line2">まんげきょう</span>
        <span class="logo-line3">こうぼう</span>
      </div>
      <button id="btn-start" class="btn-play" aria-label="あそぶ">
        <svg viewBox="0 0 48 48"><path d="M17 12.5c0-2.3 2.5-3.7 4.5-2.5l16 9.5c2 1.2 2 4 0 5.2l-16 9.5c-2 1.2-4.5-.3-4.5-2.5z" fill="#fff"/></svg>
      </button>
    </div>
    <div class="title-sparkles" aria-hidden="true">
      <i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i>
    </div>
  </section>

  <!-- ══════════════ せかい（いつも のぞいている） ══════════════ -->
  <section id="screen-peek" class="screen">
    <canvas id="peek-canvas"></canvas>

    <div class="peek-ui">
      <button id="btn-home" class="btn-round btn-glass corner-tl" aria-label="タイトルへ">
        <svg viewBox="0 0 24 24"><path d="M12 3.5 3 11h2.5v8.5a1 1 0 0 0 1 1H10v-6h4v6h3.5a1 1 0 0 0 1-1V11H21z" fill="currentColor"/></svg>
      </button>
      <div class="peek-right-btns">
        <button id="btn-tilt" class="btn-round btn-glass hidden" aria-label="かたむきセンサー">
          <svg viewBox="0 0 24 24"><rect x="6" y="3" width="12" height="18" rx="2.5" fill="none" stroke="currentColor" stroke-width="2" transform="rotate(14 12 12)"/><path d="M4 20q8 3 16-2" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-dasharray="1.5 3"/></svg>
        </button>
        <button id="btn-photo" class="btn-round btn-glass" aria-label="しゃしんをとる">
          <svg viewBox="0 0 24 24"><path d="M4 7h3.5L9 4.8h6L16.5 7H20a1.5 1.5 0 0 1 1.5 1.5v10A1.5 1.5 0 0 1 20 20H4a1.5 1.5 0 0 1-1.5-1.5v-10A1.5 1.5 0 0 1 4 7z" fill="currentColor"/><circle cx="12" cy="13" r="4" fill="#2a1a3e"/><circle cx="12" cy="13" r="2.2" fill="#fff" opacity=".9"/></svg>
        </button>
        <button id="btn-sound2" class="btn-round btn-glass" aria-label="おと">
          <svg class="icon-sound-on" viewBox="0 0 24 24"><path d="M4 9v6h4l5 4.5v-15L8 9H4z" fill="currentColor"/><path d="M16.5 8.5a5 5 0 0 1 0 7M18.8 6a8.4 8.4 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          <svg class="icon-sound-off" viewBox="0 0 24 24"><path d="M4 9v6h4l5 4.5v-15L8 9H4z" fill="currentColor"/><path d="M16.5 9.5 21 14M21 9.5 16.5 14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
        </button>
      </div>

      <!-- どうぐばこ -->
      <div class="dock-wrap">
        <div class="dock hidden" id="dock">
          <div class="dock-chips" id="dock-chips">
            <button class="chip" data-cat="tube" aria-label="つつ"><i class="dti-tube"></i></button>
            <button class="chip" data-cat="mirror" aria-label="かがみ"><i class="dti-mirror"></i></button>
            <button class="chip" data-cat="skin" aria-label="かがみのせいかく"><i class="dti-skin"></i></button>
            <button class="chip" data-cat="fill" aria-label="なかみ"><i class="dti-fill"></i></button>
            <button class="chip" data-cat="light" aria-label="ひかり"><i class="dti-light"></i></button>
            <button class="chip" data-cat="hole" aria-label="のぞきあな"><i class="dti-hole"></i></button>
          </div>
          <div class="dock-panels">
            <div class="dock-panel" id="dp-tube"><div class="cat-row" id="cat-tube"></div></div>
            <div class="dock-panel" id="dp-mirror">
              <div class="cat-row" id="cat-mirror"></div>
              <div class="skew-slim">
                <svg class="skew-icon straight" viewBox="0 0 32 32"><rect x="13" y="4" width="6" height="24" rx="2" fill="currentColor"/></svg>
                <input type="range" id="skew-slider" min="-100" max="100" value="0" step="1">
                <svg class="skew-icon tilted" viewBox="0 0 32 32"><rect x="13" y="4" width="6" height="24" rx="2" fill="currentColor" transform="rotate(18 16 16)"/></svg>
              </div>
            </div>
            <div class="dock-panel" id="dp-skin"><div class="cat-row" id="cat-skin"></div></div>
            <div class="dock-panel" id="dp-fill">
              <div class="fill-row">
                <span class="dock-window"><canvas id="chamber-view"></canvas></span>
                <div class="shelf" id="shelf">
                  <button class="jar" data-material="beads" aria-label="びーず">
                    <svg viewBox="0 0 80 96" class="jar-svg">
                      <path class="jar-glass" d="M16 30 Q14 34 14 42 L14 82 Q14 90 22 90 L58 90 Q66 90 66 82 L66 42 Q66 34 64 30 Z"/>
                      <g class="jar-content">
                        <circle cx="30" cy="76" r="9" fill="#ff8fb3"/><circle cx="48" cy="79" r="8" fill="#7cc8ff"/>
                        <circle cx="40" cy="64" r="8.5" fill="#ffd166"/><circle cx="55" cy="66" r="7" fill="#7be0c4"/>
                        <circle cx="25" cy="60" r="7" fill="#c6a8ff"/><circle cx="46" cy="51" r="7.5" fill="#ff9e7d"/>
                        <circle cx="33" cy="47" r="6.5" fill="#7cc8ff"/>
                        <circle cx="27" cy="73" r="3" fill="#ffffff" opacity=".55"/><circle cx="37" cy="61" r="2.6" fill="#ffffff" opacity=".55"/>
                      </g>
                      <path class="jar-shine" d="M20 36 Q19 40 19 46 L19 76 Q19 80 21 82" fill="none"/>
                      <rect class="jar-lid" x="12" y="18" width="56" height="14" rx="6"/>
                    </svg>
                  </button>
                  <button class="jar" data-material="glitter" aria-label="きらきら">
                    <svg viewBox="0 0 80 96" class="jar-svg">
                      <path class="jar-glass" d="M16 30 Q14 34 14 42 L14 82 Q14 90 22 90 L58 90 Q66 90 66 82 L66 42 Q66 34 64 30 Z"/>
                      <g class="jar-content jar-glitter">
                        <path d="M14 58 Q30 50 44 58 T66 56 L66 82 Q66 90 58 90 L22 90 Q14 90 14 82 Z" fill="url(#glitterGrad)"/>
                        <g fill="#fff">
                          <path d="M30 46l1.6 3.4L35 51l-3.4 1.6L30 56l-1.6-3.4L25 51l3.4-1.6z"/>
                          <path d="M50 40l1.3 2.7 2.7 1.3-2.7 1.3L50 48l-1.3-2.7L46 44l2.7-1.3z" opacity=".9"/>
                          <path d="M42 66l1.2 2.5 2.5 1.2-2.5 1.2-1.2 2.5-1.2-2.5-2.5-1.2 2.5-1.2z" opacity=".8"/>
                          <path d="M26 72l1 2.1 2.1 1-2.1 1-1 2.1-1-2.1-2.1-1 2.1-1z" opacity=".7"/>
                          <path d="M55 70l1 2.1 2.1 1-2.1 1-1 2.1-1-2.1-2.1-1 2.1-1z" opacity=".85"/>
                        </g>
                      </g>
                      <path class="jar-shine" d="M20 36 Q19 40 19 46 L19 76 Q19 80 21 82" fill="none"/>
                      <rect class="jar-lid" x="12" y="18" width="56" height="14" rx="6"/>
                      <defs>
                        <linearGradient id="glitterGrad" x1="0" y1="0" x2="1" y2="1">
                          <stop offset="0" stop-color="#ffe08a"/><stop offset=".4" stop-color="#ffb3d9"/>
                          <stop offset=".7" stop-color="#a8e6ff"/><stop offset="1" stop-color="#d9c2ff"/>
                        </linearGradient>
                      </defs>
                    </svg>
                  </button>
                  <button class="jar" data-material="petals" aria-label="はなびら">
                    <svg viewBox="0 0 80 96" class="jar-svg">
                      <path class="jar-glass" d="M16 30 Q14 34 14 42 L14 82 Q14 90 22 90 L58 90 Q66 90 66 82 L66 42 Q66 34 64 30 Z"/>
                      <g class="jar-content">
                        <path d="M28 78q-8-5-4-13 8-3 11 5 1 8-7 8z" fill="#ffc7dd"/>
                        <path d="M50 80q9-3 7-12-7-5-12 2-3 8 5 10z" fill="#ffb3cf"/>
                        <path d="M40 62q-8-4-5-12 8-4 12 3 2 9-7 9z" fill="#ffe3ec"/>
                        <path d="M27 56q-7-4-4-11 7-3 10 3 2 8-6 8z" fill="#fff2b8"/>
                        <path d="M52 58q8-4 5-12-8-3-11 4-2 8 6 8z" fill="#ffd9c2"/>
                        <path d="M39 45q-6-3-4-9 6-3 9 2 2 7-5 7z" fill="#ffc7dd"/>
                      </g>
                      <path class="jar-shine" d="M20 36 Q19 40 19 46 L19 76 Q19 80 21 82" fill="none"/>
                      <rect class="jar-lid" x="12" y="18" width="56" height="14" rx="6"/>
                    </svg>
                  </button>
                  <button class="jar" data-material="stars" aria-label="おほしさま">
                    <svg viewBox="0 0 80 96" class="jar-svg">
                      <path class="jar-glass" d="M16 30 Q14 34 14 42 L14 82 Q14 90 22 90 L58 90 Q66 90 66 82 L66 42 Q66 34 64 30 Z"/>
                      <g class="jar-content">
                        <path d="m30 68 2.9 5.9 6.5.9-4.7 4.6 1.1 6.4L30 82.8l-5.8 3 1.1-6.4-4.7-4.6 6.5-.9z" fill="#ffd75e"/>
                        <path d="m50 64 2.6 5.3 5.9.8-4.3 4.1 1 5.8-5.2-2.7-5.2 2.7 1-5.8-4.3-4.1 5.9-.8z" fill="#ff9ec9"/>
                        <path d="m40 44 2.6 5.3 5.9.8-4.3 4.1 1 5.8-5.2-2.7-5.2 2.7 1-5.8-4.3-4.1 5.9-.8z" fill="#8fd8ff"/>
                        <path d="m26 50 2 4 4.5.6-3.3 3.2.8 4.4-4-2.1-4 2.1.8-4.4-3.3-3.2 4.5-.6z" fill="#c9b1ff"/>
                      </g>
                      <path class="jar-shine" d="M20 36 Q19 40 19 46 L19 76 Q19 80 21 82" fill="none"/>
                      <rect class="jar-lid" x="12" y="18" width="56" height="14" rx="6"/>
                    </svg>
                  </button>
                  <button class="jar jar-special" id="jar-paint" aria-label="じぶんのえをかく">
                    <svg viewBox="0 0 80 96" class="jar-svg">
                      <rect x="12" y="26" width="56" height="60" rx="10" fill="#fffdf6" stroke="#e0cfae" stroke-width="2.5"/>
                      <path d="M24 66 Q30 44 44 40" fill="none" stroke="#ff5f96" stroke-width="7" stroke-linecap="round"/>
                      <path d="M34 72 Q46 62 56 64" fill="none" stroke="#3fa0e8" stroke-width="7" stroke-linecap="round"/>
                      <circle cx="52" cy="48" r="5.5" fill="#ffcf3e"/>
                      <g transform="rotate(38 58 30)">
                        <rect x="54" y="10" width="9" height="26" rx="2" fill="#f0658a"/>
                        <path d="M54 36 h9 l-4.5 8 z" fill="#ffc9da"/>
                        <rect x="54" y="10" width="9" height="6" fill="#c94a6d"/>
                      </g>
                    </svg>
                  </button>
                  <button class="jar jar-special" id="jar-photo" aria-label="しゃしんをえらぶ">
                    <svg viewBox="0 0 80 96" class="jar-svg">
                      <rect x="10" y="30" width="60" height="46" rx="9" fill="#8fd8ff" stroke="#4d9fd6" stroke-width="2.5"/>
                      <rect x="28" y="22" width="24" height="12" rx="4" fill="#4d9fd6"/>
                      <circle cx="40" cy="53" r="14" fill="#2a5f80"/>
                      <circle cx="40" cy="53" r="9" fill="#bfe9ff"/>
                      <circle cx="36.5" cy="49.5" r="3" fill="#ffffff"/>
                      <circle cx="61" cy="39" r="3.4" fill="#fff3c9"/>
                    </svg>
                  </button>
                </div>
              </div>
              <div class="fill-row2">
                <button class="toggle-water" id="btn-water" aria-label="おみず">
                  <svg viewBox="0 0 40 40" class="water-icon">
                    <path d="M20 4 Q30 18 30 26 a10 10 0 0 1-20 0 Q10 18 20 4z" fill="#8fd8ff" stroke="#5db6e8" stroke-width="2"/>
                    <path d="M15.5 25 q0 5 4.5 6.5" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" opacity=".85"/>
                  </svg>
                  <span class="toggle-knob"><i></i></span>
                </button>
                <div class="fill-gauge" id="fill-gauge"><div class="fill-gauge-bar" id="fill-gauge-bar"></div></div>
                <button class="btn-empty" id="btn-empty" aria-label="からっぽにする">
                  <svg viewBox="0 0 24 24"><path d="M5 7h14M10 7V5h4v2m-8 0 1 13h10l1-13" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
                </button>
              </div>
              <div class="stamp-shelf hidden" id="stamp-shelf">
                <div class="stamp-thumbs" id="stamp-thumbs"></div>
              </div>
            </div>
            <div class="dock-panel" id="dp-light"><div class="cat-row" id="cat-light"></div></div>
            <div class="dock-panel" id="dp-hole">
              <div class="cat-row" id="cat-hole"></div>
              <div class="cat-row" id="cat-lens"></div>
            </div>
          </div>
        </div>
        <button id="btn-dock" class="btn-dock" aria-label="どうぐばこ">
          <svg viewBox="0 0 48 48">
            <rect x="6" y="18" width="36" height="22" rx="5" fill="#c98f5e" stroke="#8a5830" stroke-width="2.5"/>
            <path d="M18 18v-4a6 6 0 0 1 12 0v4" fill="none" stroke="#8a5830" stroke-width="3.5" stroke-linecap="round"/>
            <rect x="20" y="24" width="8" height="7" rx="2" fill="#ffd166" stroke="#c8922a" stroke-width="1.8"/>
            <circle cx="13" cy="29" r="2.6" fill="#ff8fb3"/>
            <circle cx="35" cy="29" r="2.6" fill="#7cc8ff"/>
          </svg>
        </button>
      </div>

      <!-- ほしのこ（ことばの世界の住人） -->
      <button id="hoshinoko" class="st-sleep" aria-label="ほしのこ">
        <svg viewBox="0 0 120 120">
          <defs>
            <radialGradient id="hoshiBody" cx="42%" cy="36%" r="75%">
              <stop offset="0" stop-color="#fff8d0"/>
              <stop offset=".55" stop-color="#ffe07a"/>
              <stop offset="1" stop-color="#f0b93e"/>
            </radialGradient>
          </defs>
          <path class="hoshi-body" d="M60 8l13.2 26.8 29.6 4.3-21.4 20.9 5 29.5L60 75.6 33.6 89.5l5-29.5L17.2 39.1l29.6-4.3z"
                fill="url(#hoshiBody)" stroke="#d99a2b" stroke-width="3" stroke-linejoin="round"/>
          <g class="hoshi-face">
            <g class="eyes-sleep">
              <path d="M46 56 q4 4 8 0" fill="none" stroke="#7a5215" stroke-width="3.4" stroke-linecap="round"/>
              <path d="M66 56 q4 4 8 0" fill="none" stroke="#7a5215" stroke-width="3.4" stroke-linecap="round"/>
            </g>
            <g class="eyes-open">
              <circle cx="50" cy="55" r="4.4" fill="#4a3210"/>
              <circle cx="70" cy="55" r="4.4" fill="#4a3210"/>
              <circle cx="51.5" cy="53.5" r="1.5" fill="#fff"/>
              <circle cx="71.5" cy="53.5" r="1.5" fill="#fff"/>
            </g>
            <circle cx="42" cy="63" r="4.5" fill="#ffb199" opacity=".75"/>
            <circle cx="78" cy="63" r="4.5" fill="#ffb199" opacity=".75"/>
            <path class="mouth-smile" d="M55 65 q5 5 10 0" fill="none" stroke="#7a5215" stroke-width="3" stroke-linecap="round"/>
            <ellipse class="mouth-yawn" cx="60" cy="67" rx="5.5" ry="7" fill="#8a5a20"/>
          </g>
          <g class="hoshi-zzz" fill="#fff" opacity=".85">
            <text x="88" y="30" font-size="16" font-weight="bold">z</text>
            <text x="98" y="18" font-size="12" font-weight="bold">z</text>
          </g>
        </svg>
      </button>
      <div id="hoshi-bubble" class="hidden"></div>

      <!-- いたずらもじ さがし（ことばの宝石の輪） -->
      <div id="word-ring" class="hidden"></div>
      <!-- ほんものの かぎ -->
      <div id="word-tray" class="hidden"></div>
      <!-- もじビーズの くみたて -->
      <div id="asm-board" class="hidden"></div>

      <!-- くるくるコーチ（手だけ・ことばなし） -->
      <div class="coach hidden" id="coach">
        <div class="coach-orbit">
          <svg class="coach-hand" viewBox="0 0 48 48">
            <path d="M18 44c-4-3-8-9-8-14v-8a3 3 0 0 1 6 0v3-14a3 3 0 0 1 6 0v10-12a3 3 0 0 1 6 0v12-9a3 3 0 0 1 6 0v11a26 26 0 0 1-2 11c-1.6 3.4-4 7-6 9z" fill="#ffe3c9" stroke="#e8b98f" stroke-width="1.6"/>
          </svg>
        </div>
      </div>
    </div>

    <div class="photo-flash" id="photo-flash"></div>

    <!-- しゃしんモーダル -->
    <div class="photo-modal hidden" id="photo-modal">
      <div class="photo-card">
        <p class="photo-card-title">✨</p>
        <img id="photo-img" alt="まんげきょうの しゃしん">
        <div class="photo-card-btns">
          <a id="photo-save" class="btn-icon btn-icon-candy" download="mangekyou.png" aria-label="ほぞん">
            <svg viewBox="0 0 24 24"><path d="M12 3v11m0 0 5-5m-5 5-5-5M4 19h16" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </a>
          <button id="photo-close" class="btn-icon btn-icon-plain" aria-label="とじる">
            <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></svg>
          </button>
        </div>
      </div>
    </div>

    <div class="bench-pour-layer" id="pour-layer"></div>
  </section>

  <!-- ══════════════ おえかきスタンプこうぼう ══════════════ -->
  <div class="modal hidden" id="paint-modal">
    <div class="paint-wrap">
      <div class="paint-live">
        <div class="paint-preview-ring"><canvas id="paint-preview"></canvas></div>
      </div>
      <div class="paint-main">
        <div class="paint-board-wrap">
          <canvas id="paint-canvas"></canvas>
        </div>
        <div class="paint-tools">
          <div class="crayons" id="crayons"></div>
          <div class="paint-actions">
            <button id="paint-mirror-pen" class="paint-toggle on" aria-label="かがみペン">
              <svg viewBox="0 0 32 32"><path d="M16 4v24M8 10l-4 6 4 6M24 10l4 6-4 6" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
            <button id="paint-clear" class="paint-toggle" aria-label="ぜんぶけす">
              <svg viewBox="0 0 24 24"><path d="M5 7h14M10 7V5h4v2m-8 0 1 13h10l1-13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
          </div>
        </div>
        <div class="paint-footer">
          <button id="paint-cancel" class="btn-icon btn-icon-plain" aria-label="やめる">
            <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></svg>
          </button>
          <button id="paint-done" class="btn-icon btn-icon-candy btn-icon-big" aria-label="できた">
            <svg viewBox="0 0 24 24"><path d="M4.5 12.5 10 18 19.5 7" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- ══════════════ しゃしんキャンディーマシン ══════════════ -->
  <div class="modal hidden" id="photo-machine">
    <div class="machine-card">
      <p class="machine-title">🍬</p>
      <div class="machine-stage" id="machine-stage"></div>
      <div class="machine-btns">
        <button id="machine-cancel" class="btn-icon btn-icon-plain" aria-label="やめる">
          <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></svg>
        </button>
        <button id="machine-add" class="btn-icon btn-icon-candy btn-icon-big hidden" aria-label="つつにいれる">
          <svg viewBox="0 0 24 24"><path d="M4.5 12.5 10 18 19.5 7" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
    </div>
  </div>
  <input type="file" id="photo-input" accept="image/*" class="hidden">

</div>

<script src="js/config.js"></script>
<script src="js/shapes.js"></script>
<script src="js/audio.js"></script>
<script src="js/sprites.js"></script>
<script src="js/stampify.js"></script>
<script src="js/chamber.js"></script>
<script src="js/kaleido.js"></script>
<script src="js/paint.js"></script>
<script src="js/photo.js"></script>
<script src="js/words.js"></script>
