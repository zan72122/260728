<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<title>みずみちラボ</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">
  <div id="topbar">
    <canvas id="mascot" width="120" height="120"></canvas>
    <div id="modeButtons">
      <button class="modeBtn active" id="modeFree"><canvas width="96" height="96"></canvas><span>あそぶ</span></button>
      <button class="modeBtn" id="modeQuest"><canvas width="96" height="96"></canvas><span>おだい</span></button>
      <button class="modeBtn" id="modeCompare"><canvas width="96" height="96"></canvas><span>みくらべ</span></button>
    </div>
    <div class="spacer"></div>
    <button class="cmdBtn" id="btnUndo"><canvas width="96" height="96"></canvas></button>
    <button class="cmdBtn" id="btnReset"><canvas width="96" height="96"></canvas></button>
  </div>

  <div id="stage">
    <canvas id="game"></canvas>

    <!-- おだいモード HUD -->
    <div id="questHud" class="hidden">
      <div id="questChip"></div>
      <button id="btnGo"><canvas width="140" height="140"></canvas></button>
    </div>

    <!-- みくらべモード HUD -->
    <div id="compareHud" class="hidden">
      <button class="compareBtn" id="btnSnap"><canvas width="110" height="110"></canvas><span>おぼえる</span></button>
      <button class="compareBtn hidden" id="btnSnapClear"><canvas width="110" height="110"></canvas><span>わすれる</span></button>
    </div>
  </div>

  <!-- たてもの えらび -->
  <div id="subPalette" class="hidden">
    <button class="subBtn" data-kind="house"><canvas width="110" height="110"></canvas></button>
    <button class="subBtn" data-kind="shop"><canvas width="110" height="110"></canvas></button>
    <button class="subBtn" data-kind="school"><canvas width="110" height="110"></canvas></button>
  </div>

  <div id="toolbar">
    <button class="tool" data-tool="mountain"><canvas width="110" height="110"></canvas><span>やま</span></button>
    <button class="tool" data-tool="ditch"><canvas width="110" height="110"></canvas><span>みぞ</span></button>
    <button class="tool" data-tool="river"><canvas width="110" height="110"></canvas><span>かわ</span></button>
    <button class="tool" data-tool="levee"><canvas width="110" height="110"></canvas><span>ていぼう</span></button>
    <button class="tool" data-tool="building"><canvas width="110" height="110"></canvas><span>たてもの</span></button>
    <button class="tool" data-tool="plateau"><canvas width="110" height="110"></canvas><span>たかだい</span></button>
    <button class="tool active" data-tool="water"><canvas width="110" height="110"></canvas><span>みず</span></button>
    <button class="tool" data-tool="wave"><canvas width="110" height="110"></canvas><span>なみ</span></button>
    <button class="tool" data-tool="eraser"><canvas width="110" height="110"></canvas><span>けす</span></button>
  </div>
</div>

<!-- タイトル -->
<div id="title">
  <canvas id="titleArt" width="800" height="600"></canvas>
  <button id="btnPlay"><canvas width="200" height="200"></canvas></button>
</div>

<!-- おだいカード -->
<div id="card" class="hidden"></div>

<!-- けっかカード -->
<div id="result" class="hidden"></div>

<script src="js/config.js"></script>
<script src="js/audio.js"></script>
<script src="js/terrain.js"></script>
<script src="js/water.js"></script>
<script src="js/entities.js"></script>
<script src="js/particles.js"></script>
<script src="js/render.js"></script>
<script src="js/icons.js"></script>
<script src="js/mascot.js"></script>
<script src="js/modes.js"></script>
<script src="js/input.js"></script>
<script src="js/main.js"></script>
</body>
</html>
