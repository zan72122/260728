<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>ゆらゆら すなもよう ラボ</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧁</text></svg>" />
</head>
<body>
  <div id="app">
    <main id="stageWrap">
      <canvas id="stage"></canvas>
      <div id="hint" class="bubble hidden">
        カップを ゆびで ひっぱって、<br />ぱっ! と はなしてみてね
      </div>
      <div id="popup" class="hidden"></div>
      <div id="colorToast" class="color-toast hidden" aria-live="polite"></div>
      <div id="ffIndicator" class="ff-indicator hidden" aria-live="polite">はやおくり</div>
      <button id="fabBtn" class="fab" type="button" aria-label="メニューを ひらく" aria-expanded="false">🎨</button>
    </main>

    <aside id="panel" class="panel" aria-hidden="true">
      <div class="panel-inner">
        <div class="panel-head">
          <h1 id="title">ゆらゆら すなもよう ラボ</h1>
          <div class="panel-head-right">
            <div id="badgeBar" aria-label="あつめた ほし"></div>
            <button id="muteBtn" class="icon-btn" type="button" aria-label="おとの おん・おふ">🔊</button>
          </div>
        </div>
        <div id="palette" aria-label="すなの いろ"></div>
        <button id="ffBtn" class="action-btn action-btn-ff" type="button">⏩ ふつう</button>
        <div id="actions">
          <button id="refillBtn" class="action-btn" type="button">🥄 すなを いれる</button>
          <button id="mistBtn" class="action-btn" type="button">🌫️ きりを かける</button>
          <button id="paperBtn" class="action-btn" type="button">📄 かみを かえる</button>
        </div>
      </div>
    </aside>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
