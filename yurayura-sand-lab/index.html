<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>ゆらゆら すなもよう ラボ</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧁</text></svg>" />
</head>
<body>
  <div id="app">
    <header id="topbar">
      <h1 id="title">ゆらゆら すなもよう ラボ</h1>
      <div id="badgeBar" aria-label="あつめた ほし"></div>
      <button id="muteBtn" class="icon-btn" aria-label="おとの おん・おふ">🔊</button>
    </header>

    <main id="stageWrap">
      <canvas id="stage" width="900" height="1200"></canvas>
      <div id="hint" class="bubble">
        カップを ゆびで ひっぱって、<br />ぱっ! と はなしてみてね
      </div>
      <div id="popup" class="hidden"></div>
    </main>

    <footer id="controls">
      <div id="palette" aria-label="すなの いろ"></div>
      <div id="actions">
        <button id="refillBtn" class="action-btn">🥄 すなを いれる</button>
        <button id="mistBtn" class="action-btn">🌫️ きりを かける</button>
        <button id="paperBtn" class="action-btn">📄 かみを かえる</button>
      </div>
    </footer>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
