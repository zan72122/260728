<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="description" content="透明なレース布を重ねると大きな波模様が現れる、4歳児向けのモアレ実験ラボ">
<title>レースのまほうラボ</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- モアレ本体 (WebGL) -->
  <canvas id="gl"></canvas>
  <!-- 粒子エフェクト (2D, タッチは下へ素通し) -->
  <canvas id="fx"></canvas>

  <!-- はじめのカーテン -->
  <div id="splash">
    <div class="splash-card">
      <svg class="splash-lace" viewBox="0 0 120 60" aria-hidden="true">
        <g fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" opacity="0.9">
          <path d="M6 8 Q 60 26 114 8"/>
          <path d="M6 20 Q 60 38 114 20"/>
          <path d="M6 32 Q 60 50 114 32"/>
        </g>
        <g fill="#ffd9ec">
          <circle cx="24" cy="16" r="3"/><circle cx="60" cy="26" r="3"/>
          <circle cx="96" cy="16" r="3"/><circle cx="42" cy="34" r="3"/>
          <circle cx="78" cy="34" r="3"/>
        </g>
      </svg>
      <h1>レースの<br>まほうラボ</h1>
      <svg class="splash-hand" viewBox="0 0 64 64" aria-hidden="true">
        <g fill="#fff2d9" stroke="#8a5a3b" stroke-width="2.4" stroke-linejoin="round">
          <path d="M26 56 C 16 50 12 42 12 34 L 12 22 c 0 -3 5 -3 5 0 l 0 8
                   L 17 12 c 0 -3.6 5 -3.6 5 0 l 0 16 L 24 10 c 0 -3.6 5 -3.6 5 0
                   l 0 18 L 31 14 c 0 -3.4 5 -3.4 5 0 l 0 20 c 6 -4 11 -2 8 4
                   c -4 8 -6 12 -8 18 z"/>
        </g>
      </svg>
      <div class="splash-note">タッチしてね</div>
    </div>
  </div>

  <!-- WebGL が使えないとき -->
  <div id="nogl" class="hidden">
    <div class="splash-card">
      <h1>ごめんね</h1>
      <p>この端末では もようが うつせません。<br>べつのブラウザで ためしてね。</p>
    </div>
  </div>

  <!-- 大きなアイコンボタン (文字なしで操作できる) -->
  <nav id="toolbar" aria-label="そうさボタン"></nav>

  <script src="js/audio.js"></script>
  <script src="js/sheets.js"></script>
  <script src="js/gl-renderer.js"></script>
  <script src="js/particles.js"></script>
  <script src="js/input.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
